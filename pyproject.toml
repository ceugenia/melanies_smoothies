[project]
name = "smoothie-analytics-platform"
version = "1.0.0"
description = "End-to-end data engineering and analytics application using Python, SQL, REST APIs, SQLite, Streamlit, and Snowflake."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]